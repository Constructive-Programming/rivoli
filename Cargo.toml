[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 int3-vq MoE decode engine for AMD Strix Halo — Rust + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP span export (the `otlp` feature). reqwest-blocking-client is the default OTLP
# transport and needs no async runtime of ours — the one decode span exports
# synchronously at run end. Heavy deps, so opt-in at build time.
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", optional = true, features = ["metrics"] }
# Async streaming MoE pipeline (rocm only): the futures-util StreamExt stack from
# ollama-router drives the per-expert load‖compute overlap, with GPU/io_uring
# completions bridged to futures via async signals. Current-thread runtime — the
# decode loop is serial; the GPU streams are the concurrency, not CPU threads.
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
# Per-task async metrics: TaskMonitor's idle_duration = the expert stream's load-wait,
# poll_duration = its launch cost. Recovers the async-side timing the overlap blurs.
# io_uring O_DIRECT cold-expert streamer (rocm only). Talks to the io_uring syscalls
# directly — no liburing system lib. The HIP bounce arena + async H2D copy stay in
# kernels/async.hip (the codebase keeps HIP behind rivoli_* C wrappers).
io-uring = { version = "0.7", optional = true }
# Vulkan compute backend (the `vulkan` feature) — raw bindings, no allocator and no
# object model, which is the shape this codebase already has (see docs/VULKAN.md).
# Pinned: ash releases slowly and the surface used here is core 1.2/1.3.
ash = { version = "0.38", optional = true }
# CLI parsing. `default-features = false` on purpose: the default set pulls anstream +
# anstyle{,-parse,-query,-wincon} + colorchoice + utf8parse for COLOURED help, and every
# invocation of this binary is either a benchmark script or a run whose output is piped to
# a log. `suggestions` (strsim) is kept — with ~20 flags, "did you mean --2q-kin?" is worth
# one crate. 13 transitive crates down to 5.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }

[features]
# Teacher-forced scoring (`--ppl`). Off by default: it is a quality INSTRUMENT, not
# part of decoding, and `src/eval.rs` is the whole of it (see lib.rs).
teacher-forcing = []
# Pre-attention router recall (`--pred-probe`), the cross-layer prefetch feasibility
# measurement — docs/CACHE_PILOT.md "Feasibility, settled". A diagnostic, not a decode
# path: it adds an rmsnorm, a gemv and a BLOCKING D2H per MoE layer, which is roughly the
# per-layer cost `--hint-k` was retired for. Gated rather than merely defaulted off so the
# shipped binary cannot carry it, and so nobody reads a tok/s off a probe build.
pred-probe = []
default = []
# build.rs compiles kernels/*.hip via hipcc; pulls in the async streaming stack.
rocm = ["dep:tokio", "dep:futures-util", "dep:io-uring"]
# The second compute backend: build.rs compiles kernels/vk/*.comp via glslc. MUTUALLY
# EXCLUSIVE with `rocm` — one backend per build, no runtime selection (docs/VULKAN.md).
# The async streaming stack is now the SAME set `rocm` pulls in: phase 4 integration put
# `gpu.rs`/`pin.rs`/`asyncfetch.rs`/`stream.rs` behind `any(rocm, vulkan)`, so the
# io_uring streamer and the futures pipeline are compiled for both backends. Trimming
# this list again means un-gating those modules again.
vulkan = [
    "dep:ash",
    "dep:tokio",
    "dep:futures-util",
    "dep:io-uring",
]
# OTLP export of the always-on decode summary (one span/run, opt-in at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT). Off by default — the opentelemetry stack is heavy.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# EXPENSIVE audits: correctness probes (--checksum-x/XSUM) + fine-grained per-op
# perf timing + windowed tok/s. Off by default; `--features rocm,trace`. (The cheap
# per-token profiling + the PROFILE summary are ALWAYS ON, no feature needed.)
trace = []

# The microbench is `#![cfg(feature = "rocm")]` end to end; without the feature it
# compiles to an empty file and cargo rejects it for having no main. Skip it instead.
[[example]]
name = "dot_bench"
required-features = ["rocm"]

# Backend-neutral: the same source builds under either backend, which is the point — it is
# the only like-for-like kernel comparison available (dot_bench measures gemv_vq, which
# Vulkan does not have). No `required-features`, because that field is an AND list and this
# example wants "rocm OR vulkan"; pinning it to one backend would delete the comparison.
#
# A featureless `cargo check/test --all-targets` builds this target and SUCCEEDS: the
# source gates its items individually and keeps a stub `main` that refuses at runtime.
# It used to carry one file-scope `#![cfg(any(rocm, vulkan))]`, which blanked the file and
# made cargo reject the example for having no `main` — so a featureless `cargo test` died
# on `E0601` here, reading like a missing function rather than a missing feature.
[[example]]
name = "moe_bench"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
