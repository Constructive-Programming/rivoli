[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 int3-vq MoE decode engine for AMD Strix Halo — Rust + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP span export (the `otlp` feature). reqwest-blocking-client is the default OTLP
# transport and needs no async runtime of ours — the one decode span exports
# synchronously at run end. Heavy deps, so opt-in at build time.
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", optional = true }
# Async streaming MoE pipeline (rocm only): the futures-util StreamExt stack from
# ollama-router drives the per-expert load‖compute overlap, with GPU/io_uring
# completions bridged to futures via async signals. Current-thread runtime — the
# decode loop is serial; the GPU streams are the concurrency, not CPU threads.
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
# Per-task async metrics: TaskMonitor's idle_duration = the expert stream's load-wait,
# poll_duration = its launch cost. Recovers the async-side timing the overlap blurs.
tokio-metrics = { version = "0.4", optional = true }
# io_uring O_DIRECT cold-expert streamer (rocm only). Talks to the io_uring syscalls
# directly — no liburing system lib. The HIP bounce arena + async H2D copy stay in
# kernels/async.hip (the codebase keeps HIP behind rivoli_* C wrappers).
io-uring = { version = "0.7", optional = true }
# Vulkan compute backend (the `vulkan` feature) — raw bindings, no allocator and no
# object model, which is the shape this codebase already has (see docs/VULKAN.md).
# Pinned: ash releases slowly and the surface used here is core 1.2/1.3.
ash = { version = "0.38", optional = true }

[features]
default = []
# build.rs compiles kernels/*.hip via hipcc; pulls in the async streaming stack.
rocm = ["dep:tokio", "dep:futures-util", "dep:tokio-stream", "dep:tokio-metrics", "dep:io-uring"]
# The second compute backend: build.rs compiles kernels/vk/*.comp via glslc. MUTUALLY
# EXCLUSIVE with `rocm` — one backend per build, no runtime selection (docs/VULKAN.md).
# ponytail: only the deps the ported phases actually use. io-uring/tokio-stream/
# tokio-metrics arrive with stream.rs/asyncfetch.rs in the integration phase.
vulkan = ["dep:ash", "dep:tokio", "dep:futures-util"]
# OTLP export of the always-on decode summary (one span/run, opt-in at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT). Off by default — the opentelemetry stack is heavy.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# EXPENSIVE audits: correctness probes (--checksum-x/XSUM) + fine-grained per-op
# perf timing + windowed tok/s. Off by default; `--features rocm,trace`. (The cheap
# per-token profiling + the PROFILE summary are ALWAYS ON, no feature needed.)
trace = []

# The microbench is `#![cfg(feature = "rocm")]` end to end; without the feature it
# compiles to an empty file and cargo rejects it for having no main. Skip it instead.
[[example]]
name = "dot_bench"
required-features = ["rocm"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
