[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 MoE decode engine for AMD Strix Halo — Rust + tokio streaming + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
libc = "0.2"
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
rocm = []          # build.rs compiles kernels/*.hip via hipcc when enabled

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
