[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 int3-vq MoE decode engine for AMD Strix Halo — Rust + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is REQUIRED, not a preference: the chat template renders tool schemas by
# iterating the object as the client sent it, and serde_json's default Map is a BTreeMap that
# would alphabetize them. `{"description":…,"name":…}` is a different token sequence from the
# `{"name":…,"description":…}` the model was trained on. Caught by
# tests/artifact.rs::tool_framing_matches_the_checkpoint_template.
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP span export (the `otlp` feature). reqwest-blocking-client is the default OTLP
# transport and needs no async runtime of ours — the one decode span exports
# synchronously at run end. Heavy deps, so opt-in at build time.
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", optional = true, features = ["metrics"] }
# The async waker behind `backend::Signal`, which turns a GPU completion into a future.
# This was `futures-util`, whose only import here was `futures_util::task::AtomicWaker` —
# the standalone crate is that same type with ZERO transitive dependencies, against 11.
# Nothing here uses `Stream`/`StreamExt`/`FuturesUnordered`; there is no combinator stack.
atomic-waker = { version = "1", optional = true }
# io_uring O_DIRECT cold-expert streamer (rocm only). Talks to the io_uring syscalls
# directly — no liburing system lib. The HIP bounce arena + async H2D copy stay in
# kernels/async.hip (the codebase keeps HIP behind rivoli_* C wrappers).
io-uring = { version = "0.7", optional = true }
# CLI parsing. `default-features = false` on purpose: the default set pulls anstream +
# anstyle{,-parse,-query,-wincon} + colorchoice + utf8parse for COLOURED help, and every
# invocation of this binary is either a benchmark script or a run whose output is piped to
# a log. `suggestions` (strsim) is kept — with ~20 flags, "did you mean --2q-kin?" is worth
# one crate. 13 transitive crates down to 5.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# Safetensors header parsing — the READER half only. Both hand-rolled readers (the engine's
# `artifact::format::Safetensors`, the oracle's independent `v4oracle::Checkpoint`) walked the
# `u64 hlen ‖ JSON ‖ data` framing and its offset arithmetic by hand. `read_metadata` replaces
# that and checks strictly MORE: offsets contiguous from 0, and `end - begin == shape.product()
# * dtype.size()` for every tensor in the shard at open time, not just the one being fetched.
#
# **The WRITER is deliberately NOT adopted, and cannot be.** `safetensors::serialize` sorts
# tensors by (descending dtype, then name) and pads the header to a multiple of 8 with spaces;
# `SafeWriter` preserves insertion order and does not pad. Same tensors, different bytes — so
# adopting it would make every artifact already on disk unreproducible by its own converter,
# which is the one thing G2 exists to forbid. `SafeWriter` stays hand-rolled and says so.
#
# `default-features = false, features = ["alloc"]` for the same reason as clap's above: the
# `std` feature exists to pull `dep:tempfile` for `serialize_to_file`'s atomic rename — part
# of the writer we are not using — and it costs tempfile + rustix + linux-raw-sys + fastrand.
# 8 transitive crates down to 4. The only thing given up is `impl std::error::Error`, so these
# errors cross into anyhow by Display rather than by `?`.
safetensors = { version = "0.8.0", default-features = false, features = ["alloc"] }

[features]
# Teacher-forced scoring — `--ppl` (`src/eval.rs`), which since 2026-08-08 scores EITHER
# architecture (`GpuEngine::nll_forced` for GLM, `V4Engine::nll_forced` for V4 — the latter
# rides the same hook as V4's own `--logit-dump`/`--force-tokens`
# (`v4gpu::V4Engine::arm_logit_trace`), added at §M9). All of it is the same class of
# instrument (a forced decode scored per position, blocking D2H on the decode path), so it
# shares the feature rather than doubling `tests/feature-matrix.sh`'s powerset. Off by
# default: quality INSTRUMENTS, not part of decoding.
teacher-forcing = []
# Pre-attention router recall (`--pred-probe`), the cross-layer prefetch feasibility
# measurement — docs/investigations/cross-layer-prefetch.md "Feasibility, settled". A diagnostic, not a decode
# path: it adds an rmsnorm, a gemv and a BLOCKING D2H per MoE layer, which is roughly the
# per-layer cost `--hint-k` was retired for. Gated rather than merely defaulted off so the
# shipped binary cannot carry it, and so nobody reads a tok/s off a probe build.
pred-probe = []
# 1-step-stale DSA row selection (`--stale-sel`) — M1a of docs/investigations/npu-offload.md,
# the quality gate the whole NPU-offload question is behind. A quality INSTRUMENT for `--ppl`
# A/Bs, not a decode path: same feature-AND-flag rule as the two above. Mechanism and the
# serve/store semantics: `indexer::StaleShare`'s doc and `gpu.rs::dsa_select_layer`.
stale-sel = []
default = []
# build.rs compiles kernels/*.hip via hipcc; pulls in the async streaming stack.
#
# THE ONLY BACKEND, since 2026-08-06. A `vulkan` feature selected a second one until then;
# it was retired as an unfinished port (6 of 36 mode-matrix cells decoding, 16 of 29
# kernels, ~1.9x slower, no V4 path at all) and the code is preserved at the tag
# `archive/vulkan-backend-hb16`. `backend.rs` therefore no longer switches between two
# implementations — but it is still a waist, because the featureless build has neither.
rocm = ["dep:atomic-waker", "dep:io-uring"]
# OTLP export of the always-on decode summary (one span/run, opt-in at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT). Off by default — the opentelemetry stack is heavy.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# EXPENSIVE audits: correctness probes (--checksum-x/XSUM) + fine-grained per-op
# perf timing + windowed tok/s. Off by default; `--features rocm,trace`. (The cheap
# per-token profiling + the PROFILE summary are ALWAYS ON, no feature needed.)
trace = []

# The microbench is `#![cfg(feature = "rocm")]` end to end; without the feature it
# compiles to an empty file and cargo rejects it for having no main. Skip it instead.
[[example]]
name = "dot_bench"
required-features = ["rocm"]

# Still no `required-features`, and the reason CHANGED on 2026-08-06 — do not "tidy" this
# into `required-features = ["rocm"]` without reading both halves.
#
# It used to exist to compare the two backends on the same source: the only like-for-like
# kernel comparison available, since dot_bench measures gemv_vq, which Vulkan never had.
# That reason died with the Vulkan backend. DO NOT GO LOOKING FOR THE COMPARISON — there is
# one backend now, and this is a rocm microbench like dot_bench.
#
# What survives is the second reason, which is why the shape is unchanged: a featureless
# `cargo check/test --all-targets` BUILDS this target and succeeds, because the source
# gates its items individually and keeps a stub `main` that refuses at runtime. Adding
# `required-features` would make cargo skip it instead — and since the `vulkan` CI job went
# with the backend, the featureless job is the only one left that compiles this file at all.
# It used to carry one file-scope `#![cfg(any(rocm, vulkan))]`, which blanked the file and
# made cargo reject the example for having no `main` — so a featureless `cargo test` died
# on `E0601` here, reading like a missing function rather than a missing feature.
[[example]]
name = "moe_bench"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
