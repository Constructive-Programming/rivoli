[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 int3-vq MoE decode engine for AMD Strix Halo — Rust + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
rocm = []   # build.rs compiles kernels/*.hip via hipcc when enabled
# Per-op instrumentation (PROFILE report + bucket syncs, pin/stream timers,
# windowed tok/s). Off by default; tune with `--features rocm,trace`.
trace = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
