[package]
name = "rivoli"
version = "0.1.0"
edition = "2024"
description = "GLM-5.2 MoE decode engine for AMD Strix Halo — Rust + tokio streaming + HIP/ROCm"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP span export (opt-in via OTEL_EXPORTER_OTLP_ENDPOINT). Mirrors ollama-router.
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"

[features]
default = []
rocm = []          # build.rs compiles kernels/*.hip via hipcc when enabled
# Per-op instrumentation for perf tuning: the PROFILE report + its bucket-
# boundary syncs, the pin/stream timers, hit-source/prefetch-waste stats, the
# windowed tok/s log, and the checksum diagnostics. Off by default — a
# production build carries none of it. Tune with `--features rocm,trace`.
trace = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
opt-level = 3
