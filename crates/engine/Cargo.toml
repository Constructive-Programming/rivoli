[package]
name = "rivoli-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# THE BUILD IS THE ROCM BUILD (owner rule 2026-08-16): `rocm` is default at every level of
# the DAG, so a bare `cargo build`/`cargo test` is the real engine on this box. The
# deviceless refusal-stub arm — what CI's hipcc-less runner builds — is reached with
# `--no-default-features`, and the feature matrix pins every cell to an exact set the same
# way. This also means a bare `cargo test --workspace` is a GPU arm: flock it and pass
# `--test-threads=1` like any device suite.
default = ["rocm"]
# Forwarded down the DAG: `rocm` at any level arms the one backend.
rocm = ["rivoli-backend/rocm", "dep:io-uring"]
# The instrument features. Each gates an instrument behind a feature AND a flag; the ones
# declared empty gate code that arrives with later milestones — declared now so the
# feature matrix and CI's union clippy run compile every combination from day one (the
# old tree's `mod otlp` sat broken for weeks because no prescribed command named it).
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
teacher-forcing = []
pred-probe = []
# `--divergence-log`: the (position, layer, quantity) localiser for GLM's run-to-run
# divergence. SPLIT FROM `trace`, and the split is the whole design: `trace`'s arena
# poison-fill carries its own `device_sync` per layer-with-misses (`routed.rs::admit_misses`),
# and this probe hunts a fault that added syncs are recorded to MASK. See
# `crates/engine/src/probe.rs`'s header for the measurement.
#
# **`trace` deliberately does NOT imply it.** The archived predecessor did (`trace =
# ["corruption-probe"]`, archive 544fea7) because its `--checksum-x` had always lived under
# `trace` and a trace build had a flag to keep. `--divergence-log` was born in the same commit
# as this feature, so there is no such flag — and implying it would arm the probe in exactly
# the build whose extra barrier its own doc says invalidates the measurement (review finding,
# 2026-08-17).
corruption-probe = []
trace = []
stale-sel = []

[dev-dependencies]
# The smoke example's log sink only — the library logs through `tracing` and never
# chooses a subscriber; a real consumer (the CLI, M6) brings its own.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dependencies]
rivoli-core = { path = "../core" }
rivoli-artifact = { path = "../artifact" }
rivoli-oracles = { path = "../oracles" }
# default-features = false for cli/Cargo.toml's reason: the deviceless arm must not
# re-arm rocm through this edge.
rivoli-backend = { path = "../backend", default-features = false }
anyhow = "1"
# preserve_order is load-bearing: tool-schema key order is a trained token sequence.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
io-uring = { version = "0.7", optional = true }
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", optional = true }

# The smoke decodes on the device, so a featureless build must not try to compile it —
# `required-features` is what keeps `clippy --workspace --all-targets` honest without a
# cfg wall inside the example.
[[example]]
name = "glm_smoke"
required-features = ["rocm"]

# Same rule, same reason: the arena repro drives the io_uring ring, the pinned arena and a HIP
# stream, none of which exist without the backend.
[[example]]
name = "arena_repro"
required-features = ["rocm"]
