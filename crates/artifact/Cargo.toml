[package]
name = "rivoli-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rivoli-core = { path = "../core" }
anyhow = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
safetensors = { version = "0.8.0", default-features = false, features = ["alloc"] }
