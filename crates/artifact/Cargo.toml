[package]
name = "rivoli-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rivoli-core = { path = "../core" }
anyhow = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
safetensors = { version = "0.8.0", default-features = false, features = ["alloc"] }
# The trained BPE vocab is 19.3 MB of data; hand-rolling its decoder would be the
# archetypal wheel to not reinvent. `default-features = false` + `fancy-regex` is the
# reference's own feature choice (`old:Cargo.toml` @ 6b7f496) — it drops `onig` (a C
# dependency) and `http` (a network fetcher this engine must never grow), leaving the
# pure-Rust pattern engine the GLM pre-tokenizer's lookarounds need.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Kimi-K3's vocabulary is tiktoken, not HuggingFace JSON, so `tokenizers` cannot read it
# (`src/tiktoken.rs` carries why). Both of these are ALREADY in the dependency graph as
# transitive deps of `tokenizers` at these exact versions, so naming them directly adds zero
# compilation and zero supply-chain surface — which is the whole argument for reusing them
# instead of hand-rolling. `fancy-regex` is the only engine here that can express K3's
# `\s+(?!\S)`: the `regex` crate has no lookaround at all, and dropping that alternative
# changes whitespace tokenization silently.
fancy-regex = "0.14"
base64 = "0.22"
