[package]
name = "rivoli-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The only backend. A featureless build compiles this crate down to `abi` alone — that is
# the refusal-stub configuration CI tests, not breakage.
rocm = ["dep:atomic-waker", "dep:anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
atomic-waker = { version = "1", optional = true }

[lints]
workspace = true

