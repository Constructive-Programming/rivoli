[package]
name = "rivoli-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# THE BUILD IS THE ROCM BUILD (owner rule 2026-08-16) — see crates/engine/Cargo.toml for
# the whole note. Deviceless arm: `--no-default-features`.
default = ["rocm"]
# The only backend. A `--no-default-features` build compiles this crate down to `abi`
# alone — that is the refusal-stub configuration CI tests, not breakage.
rocm = ["dep:atomic-waker", "dep:anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
atomic-waker = { version = "1", optional = true }

[lints]
workspace = true

