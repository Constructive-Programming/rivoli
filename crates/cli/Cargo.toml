[package]
name = "rivoli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# THE BUILD IS THE ROCM BUILD (owner rule 2026-08-16) — see crates/engine/Cargo.toml for
# the whole note. Deviceless arm: `--no-default-features`.
default = ["rocm"]
# Forwarded down the DAG: `rocm` at any level arms the one backend.
rocm = ["rivoli-engine/rocm"]
otlp = ["rivoli-engine/otlp"]
teacher-forcing = ["rivoli-engine/teacher-forcing"]
pred-probe = ["rivoli-engine/pred-probe"]
trace = ["rivoli-engine/trace"]
stale-sel = ["rivoli-engine/stale-sel"]

[lints]
workspace = true

[dependencies]
rivoli-engine = { path = "../engine" }
rivoli-core = { path = "../core" }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
# The binary is the process, so it is the one that installs a log sink; every library crate
# here logs through `tracing` and never chooses a subscriber.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { version = "1", features = ["preserve_order"] }
rivoli-artifact = { path = "../artifact" }
rivoli-backend = { path = "../backend" }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }

[dev-dependencies]
serde_json = "1"
