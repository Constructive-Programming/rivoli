name: ci

# What CI can and cannot do for this crate, because it is not obvious.
#
# The real engine needs `hipcc` and a gfx1151 device, and GitHub-hosted runners have
# neither. So everything here runs in the two configurations that need NO GPU:
#
#   * featureless — the crate builds host-only and the binaries compile to a refusal stub.
#     README already describes this as "what CI/clippy runs". It covers the artifact
#     formats, the converter logic, the cache/replay sims and every registry test.
#
# THERE IS ONE JOB NOW, AND THAT COST REAL COVERAGE — 2026-08-06.
#
# A second job ran `--features vulkan`: it compiled kernels/vk/*.comp with glslc, ran the
# twelve mechanised SPIR-V rules, and — because a shader compiler is not a device — it was
# the only job that could build a REAL BACKEND on a plain runner. It went with the Vulkan
# backend. Two things it did are worth naming so they are not silently assumed:
#
#   1. It was the only place the UNION of feature-gated modules was clippy'd. That is
#      recovered below, featureless, and it does recover the specific regression class that
#      motivated the rule: `mod otlp` is gated on `#[cfg(feature = "otlp")]` ALONE, not on a
#      backend, so the E0609 that sat broken for weeks would be caught by the union step in
#      the `host` job.
#   2. It was the only place `cargo test` ran under a backend feature.
#
# WHAT NO JOB HERE COMPILES, stated rather than inherited: `src/eval.rs` is gated
# `all(feature = "teacher-forcing", feature = "rocm")`, so nothing in CI builds it —
# `--features teacher-forcing` alone adds no module. Same for every `--features rocm` path,
# every HIP kernel and every device test.
#
# That is a KNOWN gap with a named owner, not a silent one, and it is not new: CI never had a
# rocm arm to lose. `src/eval.rs` is covered by the `--features rocm,otlp,teacher-forcing,
# pred-probe,trace` union run that CLAUDE.md prescribes and that this repo practises on every
# change touching `telemetry.rs`, `eval.rs` or `gpu.rs`. The coverage is local and by hand;
# it exists.
#
# What is NOT covered here, so nobody reads a green tick as more than it is: the rocm tests
# and any tok/s number. Those need the device and run on the self-hosted runner in
# release.yml, or by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on a warning. `unwrap_used`/`expect_used` are already deny-level in Cargo.toml;
  # this extends the bar to everything else, which is the standard this tree already meets.
  RUSTFLAGS: -D warnings

jobs:
  host:
    name: featureless (build + test + duplication gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # Formatting is checked BEFORE anything expensive: it needs no cache, no build and no
      # network, and it is the failure most likely to be a one-command fix.
      #
      # This tree was not rustfmt-clean until 2026-08-02, and making it so was not cosmetic.
      # Normalising the layout turned 66 previously-invisible duplicate blocks into exact
      # matches that the duplication gate could finally see — the same code had been there
      # all along, masked by inconsistent line-breaking. So `fmt` and the jscpd gate are not
      # independent: a reformat can surface clones, which is why both run here.
      - name: fmt
        run: cargo fmt --check

      - uses: Swatinem/rust-cache@v2

      # build.rs invokes `npx --no -- jscpd`. `--no` means "never auto-install", which is
      # deliberate — a build must not silently pull a package off the network. The
      # consequence is that on a machine without jscpd the gate DOES NOT RUN: build.rs
      # prints `cargo:warning=jscpd not run` and carries on, so a duplicated-code PR would
      # sail through a green CI. Installing it here is what makes the gate real in CI, and
      # the version is pinned so a jscpd release cannot change the verdict under us.
      - name: Install jscpd (without this the duplication gate silently no-ops)
        run: npm install -g jscpd@4.0.5

      - name: Prove the duplication gate is actually armed
        # Belt and braces for the trap above: if jscpd were missing or misconfigured this
        # reports 0 clones for the wrong reason. Running it directly, and requiring the
        # file count to be plausible, makes "the scanner examined nothing" a failure
        # instead of a pass — the same anti-vacuity check tests/kernel_coverage.rs uses.
        run: |
          set -euo pipefail
          jscpd -c .jscpd.json --reporters json --output /tmp/jscpd src tests build.rs
          python3 - <<'PY'
          import json, sys
          r = json.load(open('/tmp/jscpd/jscpd-report.json'))
          fmts = r['statistics']['formats']
          files = sum(len(f['sources']) for f in fmts.values())
          clones = len(r['duplicates'])
          print(f'jscpd: {files} files scanned, {clones} clones')
          if files < 40:
              sys.exit(f'only {files} files scanned — jscpd is skipping the tree '
                       '(maxLines/maxSize defaults silently drop the largest files)')
          if clones:
              sys.exit(f'{clones} clones')
          PY

      - name: clippy
        run: cargo clippy --release --locked --all-targets

      # The union of the feature-gated modules, minus the ones that need a backend. This
      # replaces the `--features vulkan,...` union the deleted vulkan job ran. `otlp` is the
      # one that actually rotted (E0609, weeks, CLAUDE.md) and it is gated on its own feature
      # with no backend in the cfg, so it IS built here. `teacher-forcing` is named for
      # completeness and adds nothing without `rocm` — see the header.
      - name: clippy (every feature-gated module a deviceless runner can reach)
        run: cargo clippy --release --locked --features otlp,teacher-forcing,pred-probe,trace --all-targets

      - name: test
        run: cargo test --release --locked
