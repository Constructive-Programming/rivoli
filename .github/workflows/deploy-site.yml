name: Deploy site

# Builds the mdBook site in site/ and publishes it to Cloudflare Pages. This is the same
# flow as the other constructive.dev sites (eo's deploy-site.yml), minus the JVM:
#   - Pull request   -> preview deployment named after the head branch, URL posted on the PR
#   - Push to main   -> preview deployment for main
#   - Tag push v*    -> production deployment
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the Pages project name
# comes from the CLOUDFLARE_PAGES_PROJECT variable (default rivoli-site). Fork PRs are
# skipped because they cannot read the secrets.

on:
  pull_request:
    branches: [main]
    paths: [site/**, .github/workflows/deploy-site.yml]
  push:
    branches: [main]
    tags: [v*]
    paths: [site/**, .github/workflows/deploy-site.yml]
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the site was written against (mdbook v0.5.4 on the dev box).
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin mdbook
          mdbook --version

      - name: Build site
        run: mdbook build site

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/book
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'rivoli-site' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Post preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-pages-preview
          message: |
            Cloudflare Pages preview for `${{ github.head_ref }}`: ${{ steps.deploy.outputs.deployment-url }}
