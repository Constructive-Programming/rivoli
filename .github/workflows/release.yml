name: release

# Automated GitHub Packages (GHCR) + GitHub Release packaging on every version tag push.
#
# Two jobs run on `v*` tags (e.g. `v0.1.0`, `v0.1.0-rc1`) or manual `workflow_dispatch`:
#
#   1. `container` (GitHub-hosted `ubuntu-24.04` — runs immediately, no self-hosted runner
#      required): builds the multi-stage ROCm (gfx1151) Docker image from `Dockerfile`
#      (all GPU kernels are compiled in Rust via `crates/kernels` against ROCm bitcode —
#      no GPU hardware is needed to compile or link) and publishes:
#        - Container image to GHCR: `ghcr.io/constructive-programming/rivoli:<tag>`
#          (plus `latest` on stable semver tags, and `sha-<short>`),
#        - Binary tarball + SHA-256 extracted from the exact built image to the GitHub Release.
#
#   2. `device-verify` (optional self-hosted `[self-hosted, linux, rocm, gfx1151]`): only
#      runs when explicitly requested via `workflow_dispatch` with `device_verify=true` (so a
#      repo with no self-hosted runner registered never hangs a tag release in Queued state).

on:
  push:
    tags:
      # `v1.2.3` / `v1.2.3-rc1` only. Never bare `*`: archive/* tags are recovery points.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / version label (e.g. v0.1.0); defaults to Cargo.toml version"
        required: false
        default: ""
      offload_arch:
        description: "AMDGPU target arch"
        required: false
        default: "gfx1151"
      device_verify:
        description: "Also run the self-hosted gfx1151 hardware test job"
        type: boolean
        required: false
        default: false

permissions:
  contents: write  # create GitHub Releases and attach tarballs
  packages: write  # push container packages to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    name: build, push GHCR package & publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and validate tag against Cargo.toml
        id: meta
        run: |
          set -euo pipefail
          crate=$(python3 - <<'EOF'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["workspace"]["package"]["version"])
          EOF
          )
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            bare="${tag#v}"
            if [ "$crate" != "$bare" ]; then
              echo "tag ${tag} says ${bare}, Cargo.toml says ${crate}" >&2
              echo "Bump workspace.package.version in Cargo.toml (and Cargo.lock) to match the tag." >&2
              exit 1
            fi
            is_release="true"
          else
            raw="${{ inputs.tag }}"
            tag="${raw:-v${crate}}"
            is_release="false"
          fi
          arch="${{ inputs.offload_arch || 'gfx1151' }}"
          short_sha="${GITHUB_SHA:0:7}"
          is_prerelease="false"
          if [[ "$tag" == *-* ]]; then
            is_prerelease="true"
          fi
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "arch=${arch}"
            echo "short_sha=${short_sha}"
            echo "is_release=${is_release}"
            echo "is_prerelease=${is_prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${tag} arch=${arch} sha=${short_sha} release=${is_release} prerelease=${is_prerelease}"

      # Free disk space on ubuntu-24.04 before pulling the 1.2 GB ROCm base + Rust build cache.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute OCI image metadata and tags
        id: oci
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.tag }}
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.arch }}
            type=raw,value=sha-${{ steps.meta.outputs.short_sha }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_release == 'true' && steps.meta.outputs.is_prerelease == 'false' }}

      - name: Build and push GHCR container package
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.oci.outputs.tags }}
          labels: ${{ steps.oci.outputs.labels }}
          build-args: |
            RIVOLI_OFFLOAD_ARCH=${{ steps.meta.outputs.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published GHCR image and extract release tarball
        id: pack
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          IMAGE="${IMAGE,,}"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" --version
          docker run --rm "${IMAGE}" --help > /dev/null

          NAME="rivoli-${{ steps.meta.outputs.tag }}-linux-x86_64-${{ steps.meta.outputs.arch }}"
          mkdir -p "dist/${NAME}"
          cid=$(docker create "${IMAGE}")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for b in rivoli convert convert_v4 convert_glimmer convert_glimmer_drafter \
                   convert_k3 convert_qwen convert_inkling convert_inkling_small \
                   fp8_to_i4 add_indexer ppl; do
            docker cp "${cid}:/usr/local/bin/${b}" "dist/${NAME}/${b}"
            chmod 755 "dist/${NAME}/${b}"
          done
          {
            echo "rivoli ${{ steps.meta.outputs.tag }}"
            echo "commit:  ${GITHUB_SHA}"
            echo "built:   $(date -uIseconds)"
            echo "arch:    ${{ steps.meta.outputs.arch }}"
            echo "image:   ${IMAGE}@${{ steps.push.outputs.digest }}"
          } > "dist/${NAME}/BUILD-INFO.txt"
          install -m644 README.md "dist/${NAME}/README.txt"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/*.tar.gz*
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRE=""
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            PRE="--prerelease"
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            ${PRE} \
            --title "rivoli ${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --notes "Container package: \`${{ steps.pack.outputs.image }}\` (\`${{ steps.push.outputs.digest }}\`). Built for \`${{ steps.meta.outputs.arch }}\` (AMD Strix Halo) with Rust amdgcn kernels. Requires a ROCm runtime (\`libamdhip64.so\`) when running the standalone tarball outside the container." \
            "dist/${{ steps.pack.outputs.name }}.tar.gz" \
            "dist/${{ steps.pack.outputs.name }}.tar.gz.sha256"

  device-verify:
    name: verify on gfx1151 hardware (opt-in self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.device_verify == true
    runs-on: [self-hosted, linux, rocm, gfx1151]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build (outside GPU lock)
        run: cargo build --release --locked -p rivoli --features rocm --bins
      - name: Test on the device (under /var/run/sys-gpu.lock)
        run: |
          flock /var/run/sys-gpu.lock \
            cargo test --release --locked -p rivoli-engine --features rocm -- --test-threads=1
